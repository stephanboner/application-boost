name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "14 4 * * 1"

permissions:
  contents: read

jobs:
  full_history:
    name: Scan all reachable Git commits for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error             https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz             --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"

      - name: Scan ALL branches and commits (redact matches)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --exit-code 0 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json" .

      - name: Print metadata-only findings (never secret values)
        shell: bash
        run: |
          node scripts/summarize-secret-scan.mjs "$RUNNER_TEMP/gitleaks-report.json"
